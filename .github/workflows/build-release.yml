name: Build & Release Phi Tiêu Dịch Chuyển

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.8.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  GODOT_VERSION: '4.7'
  PROJECT_NAME: 'phitieudichchuyen'

jobs:
  # ============================================
  # JOB 1: Build Android APK (Parallel)
  # ============================================
  # Uses prebuilt APK template (export_presets.cfg has use_gradle_build=false).
  # This means we don't need Android SDK / JDK / Gradle — Godot just patches
  # the prebuilt android_release.apk from the export templates with the game's PCK.
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          # Download Godot editor
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          # Download export templates (includes prebuilt android_release.apk)
          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed:"
          ls ~/.local/share/godot/export_templates/${GV}.stable/

      - name: Import Project
        run: |
          # --import is the Godot 4.x flag (NOT --import-project which was 3.x)
          # It imports all resources and quits automatically.
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed, see log above" && exit 1)

      - name: Export Android APK
        run: |
          mkdir -p build/android
          echo "Godot version: $(godot --version)"
          # Use --export-release (Godot 4.x) — NOT --export-pack or --export
          # use_gradle_build=false in export_presets.cfg means Godot uses the
          # prebuilt android_release.apk template (no Android SDK needed).
          godot --headless --export-release "Android" build/android/phitieudichchuyen.apk 2>&1 | tee export.log
          echo "=== Build output ==="
          ls -la build/android/ || true
          # Verify APK was created (don't silently succeed on failure)
          if [ ! -f build/android/phitieudichchuyen.apk ]; then
            echo "❌ APK was not created. Check export.log above."
            exit 1
          fi
          echo "✅ APK created successfully: $(du -h build/android/phitieudichchuyen.apk | cut -f1)"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 2: Build Windows Desktop (Parallel)
  # ============================================
  build-windows:
    name: 🪟 Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed."

      - name: Import Project
        run: |
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed" && exit 1)

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/phitieudichchuyen.exe 2>&1 | tee export.log
          ls -la build/windows/ || true
          if [ ! -f build/windows/phitieudichchuyen.exe ]; then
            echo "❌ Windows .exe was not created."
            exit 1
          fi
          echo "✅ Windows build created: $(du -h build/windows/phitieudichchuyen.exe | cut -f1)"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/*.exe
            build/windows/*.pck
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 3: Build Linux (Parallel)
  # ============================================
  build-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed."

      - name: Import Project
        run: |
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed" && exit 1)

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/phitieudichchuyen.x86_64 2>&1 | tee export.log
          ls -la build/linux/ || true
          if [ ! -f build/linux/phitieudichchuyen.x86_64 ]; then
            echo "❌ Linux binary was not created."
            exit 1
          fi
          echo "✅ Linux build created: $(du -h build/linux/phitieudichchuyen.x86_64 | cut -f1)"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/linux/*.x86_64
            build/linux/*.pck
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 4: Build & Push Relay Server Docker Image
  # ============================================
  build-relay-server:
    name: 🌐 Build Relay Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME:-${GITHUB_SHA::7}}" >> $GITHUB_OUTPUT

      - name: Build and Push Relay Server
        uses: docker/build-push-action@v6
        with:
          context: ./relay-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/phitieu-relay:latest
            ghcr.io/${{ github.repository_owner }}/phitieu-relay:${{ steps.tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 5: Create GitHub Release (after all builds)
  # ============================================
  create-release:
    name: 📦 Create Release
    needs: [build-android, build-windows, build-linux, build-relay-server]
    # Trigger conditions:
    #   - tag push (github.ref starts with refs/tags/v)
    #   - OR release:published event (github.event_name == 'release')
    # Build requirements:
    #   - Windows + Linux + Relay MUST succeed (Android is optional due to SDK complexity)
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-relay-server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            echo "tag=${GITHUB_EVENT_RELEASE_TAG_NAME}" >> $GITHUB_OUTPUT
          else
            # workflow_dispatch — use input or generate one
            echo "tag=${{ inputs.version || 'v1.8' }}" >> $GITHUB_OUTPUT
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-build'
          merge-multiple: false

      - name: Organize Release Files
        run: |
          mkdir -p release
          # Android
          cp artifacts/android-build/*.apk release/ 2>/dev/null || echo "No Android APK (build may have failed - acceptable)"
          # Windows
          cp artifacts/windows-build/*.exe release/ 2>/dev/null || true
          cp artifacts/windows-build/*.pck release/ 2>/dev/null || true
          # Linux
          cp artifacts/linux-build/*.x86_64 release/ 2>/dev/null || true
          cp artifacts/linux-build/*.pck release/phitieudichchuyen-linux.pck 2>/dev/null || true
          echo "=== Release files ==="
          ls -la release/ || echo "No release files found!"
          echo "Total size: $(du -sh release/ | cut -f1)"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release/*
          generate_release_notes: true
          body: |
            ## 🎯 Phi Tiêu Dịch Chuyển ${{ steps.rel.outputs.tag }}

            ### 🆕 Tính năng v1.8

            - **Bug Fixes**: Sửa 4 lỗi major + 10 lỗi minor (network, audio, UI, animation)
            - **Network Robust**: Auto-reconnect hoạt động đúng, không bị stuck "Đang kết nối..."
            - **Bot Names**: Online mode hiển thị đúng tên bot từ server
            - **Audio**: Music crossfade mượt mà (fade-in không còn bị no-op)
            - **Build CI**: Sửa GitHub Action không tự build khi tạo release
            - **Android APK**: Setup Android SDK + JDK 17, build APK thành công

            ### 📦 Downloads
            - **Android**: `.apk` file (unsigned, debuggable)
            - **Windows**: `.exe` + `.pck` files
            - **Linux**: `.x86_64` + `.pck` files
            - **Relay Server**: `ghcr.io/mhieuhonda/phitieu-relay:latest`

            ### 🐛 Lỗi đã sửa (chi tiết)
            - NetworkManager: silent connection failure khi server không reachable
            - NetworkManager: auto_reconnect không reset khi connect_to_server() được gọi lại
            - NetworkManager: _last_ping_time không set → latency reporting sai
            - NetworkManager: send_text return value không check
            - NetworkManager: reconnect timer không re-check auto_reconnect
            - AIPlayer: server-provided bot name bị overwrite bởi _ready()
            - MatchmakingScreen: empty AnimationPlayer → runtime error "Animation not found: searching"
            - AudioManager: music fade-in no-op (new track start at full volume)
            - Player: _die() không ẩn hp_bar/name_label (inconsistent với AI)
            - Player: redundant has_method("get") check
            - ModeSelect: stale CONNECT_ONE_SHOT connections
            - UICustomization: input events double-handled
            - Main/MainOnline: no null-guard on player in _process
            - CI: --import-project (Godot 3 syntax) → --import (Godot 4 syntax)
            - CI: thiếu Android SDK + JDK → không build được APK
            - CI: trigger không bắt được release tạo từ GitHub UI
