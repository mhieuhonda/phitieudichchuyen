name: Build & Release APK

on:
  release:
    types: [published]

env:
  GODOT_VERSION: "4.2.2"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Platform
        run: |
          sdkmanager --install "build-tools;33.0.2"
          sdkmanager --install "platforms;android-33"

      - name: Download Godot Editor
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O godot-editor.zip
          unzip -q godot-editor.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot_editor
          chmod +x godot_editor

      - name: Download Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias phitieudichchuyen \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=PhiTieuDichChuyen, OU=Dev, O=PhiTieuDichChuyen, L=Hanoi, ST=Hanoi, C=VN" \
            -validity 10000

      - name: Import Godot Project
        run: |
          ./godot_editor --headless --import --path . 2>&1 || true
          # Wait a moment for import to complete
          sleep 3

      - name: Install Android Build Template
        run: |
          ./godot_editor --headless --path . --install-android-build-template 2>&1 || true
          sleep 2

      - name: Update Export Presets for CI Keystore
        run: |
          # Update export_presets.cfg to use the generated keystore
          sed -i 's|package/keystore=""|package/keystore="debug.keystore"|g' export_presets.cfg
          sed -i 's|package/keystore_passwd=""|package/keystore_passwd="android"|g' export_presets.cfg
          sed -i 's|package/key_alias=""|package/key_alias="phitieudichchuyen"|g' export_presets.cfg
          sed -i 's|package/key_passwd=""|package/key_passwd="android"|g' export_presets.cfg
          sed -i 's|package/signed_custom=false|package/signed_custom=true|g' export_presets.cfg
          sed -i 's|package/use_custom_keystore=false|package/use_custom_keystore=true|g' export_presets.cfg

      - name: Export Android APK
        run: |
          mkdir -p build/android
          ./godot_editor --headless --path . --export-release "Android" build/android/phitieudichchuyen.apk 2>&1 || {
            echo "=== Export failed, checking logs ==="
            ls -la build/android/ 2>/dev/null || true
            find . -name "*.log" -exec cat {} \; 2>/dev/null || true
            exit 1
          }

      - name: Verify APK
        run: |
          if [ -f "build/android/phitieudichchuyen.apk" ]; then
            echo "APK built successfully!"
            ls -la build/android/phitieudichchuyen.apk
          else
            echo "APK not found!"
            find build/ -type f 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/phitieudichchuyen.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot Editor
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O godot-editor.zip
          unzip -q godot-editor.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot_editor
          chmod +x godot_editor

      - name: Download Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import Godot Project
        run: |
          ./godot_editor --headless --import --path . 2>&1 || true
          sleep 3

      - name: Export Windows
        run: |
          mkdir -p build/windows
          ./godot_editor --headless --path . --export-release "Windows Desktop" build/windows/phitieudichchuyen.exe 2>&1 || {
            echo "Windows export failed"
            exit 0
          }

      - name: Upload Windows to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/phitieudichchuyen.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
