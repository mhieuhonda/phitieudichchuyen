name: Build & Release Phi Tiêu Dịch Chuyển

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.7.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  GODOT_VERSION: '4.7'
  PROJECT_NAME: 'phitieudichchuyen'

jobs:
  # ============================================
  # JOB 1: Build Android APK (Parallel)
  # ============================================
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          echo "Downloading Godot ${{ env.GODOT_VERSION }} from $GODOT_URL"
          wget -q "$GODOT_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          sudo mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import Godot Project
        run: |
          godot --headless --import-project project.godot --quit-after 100 2>&1 || true

      - name: Export Android
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/phitieudichchuyen.apk 2>&1 || true

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/*.apk
          retention-days: 7

  # ============================================
  # JOB 2: Build Windows Desktop (Parallel)
  # ============================================
  build-windows:
    name: 🪟 Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          echo "Downloading Godot ${{ env.GODOT_VERSION }} from $GODOT_URL"
          wget -q "$GODOT_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          sudo mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import Godot Project
        run: |
          godot --headless --import-project project.godot --quit-after 100 2>&1 || true

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/phitieudichchuyen.exe 2>&1 || true

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/*.exe
            build/windows/*.pck
          retention-days: 7

  # ============================================
  # JOB 3: Build Linux (Parallel)
  # ============================================
  build-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          echo "Downloading Godot ${{ env.GODOT_VERSION }} from $GODOT_URL"
          wget -q "$GODOT_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          sudo mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import Godot Project
        run: |
          godot --headless --import-project project.godot --quit-after 100 2>&1 || true

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/phitieudichchuyen.x86_64 2>&1 || true

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/linux/*.x86_64
            build/linux/*.pck
          retention-days: 7

  # ============================================
  # JOB 4: Build & Push Relay Server Docker Image
  # ============================================
  build-relay-server:
    name: 🌐 Build Relay Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Relay Server
        uses: docker/build-push-action@v6
        with:
          context: ./relay-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/phitieu-relay:latest
            ghcr.io/${{ github.repository_owner }}/phitieu-relay:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 5: Create GitHub Release (after all builds)
  # ============================================
  create-release:
    name: 📦 Create Release
    needs: [build-android, build-windows, build-linux, build-relay-server]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize Release Files
        run: |
          mkdir -p release
          # Android
          cp artifacts/android-build/*.apk release/ 2>/dev/null || true
          # Windows
          cp artifacts/windows-build/*.exe release/ 2>/dev/null || true
          cp artifacts/windows-build/*.pck release/ 2>/dev/null || true
          # Linux
          cp artifacts/linux-build/*.x86_64 release/ 2>/dev/null || true
          cp artifacts/linux-build/*.pck release/phitieudichchuyen-linux.pck 2>/dev/null || true
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## 🎯 Phi Tiêu Dịch Chuyển ${{ github.ref_name }}

            ### 🆕 Tính Năng v1.7 - Chơi Online!

            - **Chơi Online**: Ghép trận 10-20 người qua Relay Server
            - **Matchmaking**: Tự động tìm trận, 30s timeout, bot AI fill
            - **Mode Selection**: Chọn Online (ghép trận) hoặc Offline (chơi với máy)
            - **Relay Server**: WebSocket server cho đồng bộ real-time
            - **Player Stats**: SQLite database lưu kill/death/win/score
            - **Parallel Builds**: GitHub Actions build 3 nền tảng song song

            ### 📦 Downloads
            - **Android**: `.apk` file
            - **Windows**: `.exe` + `.pck` files
            - **Linux**: `.x86_64` + `.pck` files
            - **Relay Server**: `ghcr.io/mhieuhonda/phitieu-relay:latest`
