name: Build & Release Phi Tiêu Dịch Chuyển

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.9.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  GODOT_VERSION: '4.7'
  PROJECT_NAME: 'phitieudichchuyen'

jobs:
  # ============================================
  # JOB 1: Build Android APK (Parallel)
  # ============================================
  # Uses prebuilt APK template (export_presets.cfg has use_gradle_build=false).
  # Godot patches the prebuilt android_release.apk from export templates with the game's PCK.
  # After export, we zipalign + sign with apksigner using a debug keystore (generated in CI)
  # so the APK installs on Android devices without "package seems corrupted" error.
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          # Download Godot editor
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          # Download export templates (includes prebuilt android_release.apk)
          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed:"
          ls ~/.local/share/godot/export_templates/${GV}.stable/

      - name: Setup Java 17 (for apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (for build-tools apksigner + zipalign)
        run: |
          # Install Android SDK command-line tools + build-tools 34.0.0 (provides apksigner + zipalign)
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          cd $ANDROID_HOME
          yes | ./cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ./cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34" > /dev/null 2>&1
          echo "Build tools installed:"
          ls $ANDROID_HOME/build-tools/34.0.0/ | grep -E "apksigner|zipalign"
          # Persist env for subsequent steps
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Configure Godot editor settings (Android SDK path)
        run: |
          # Godot 4.7 requires Android SDK path in Editor Settings even when
          # use_gradle_build=false and package/signed=false. We use Godot's
          # ConfigFile-style format for editor_settings.cfg.
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          cat > "$SETTINGS_DIR/editor_settings.cfg" <<EOF
          [EditorSettings]

          export/android/android_sdk_path="${ANDROID_HOME}"
          export/android/debug_keystore=""
          export/android/debug_keystore_user="androiddebugkey"
          export/android/debug_keystore_pass="android"
          export/android/release_keystore=""
          export/android/release_keystore_user=""
          export/android/release_keystore_pass=""
          export/android/use_custom_build=false
          export/android/timestamp_output_apk=false
          export/android/force_system_user=false
          export/android/shutdown_adb_on_exit=true
          EOF
          echo "Godot editor settings written to $SETTINGS_DIR/editor_settings.cfg:"
          cat "$SETTINGS_DIR/editor_settings.cfg"

      - name: Import Project
        run: |
          # --import is the Godot 4.x flag (NOT --import-project which was 3.x)
          # It imports all resources and quits automatically.
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed, see log above" && exit 1)

      - name: Export Android APK (unsigned, from Godot)
        run: |
          mkdir -p build/android
          echo "Godot version: $(godot --version)"
          # Use --export-release (Godot 4.x). use_gradle_build=false means Godot uses the
          # prebuilt android_release.apk template from export templates.
          godot --headless --export-release "Android" build/android/phitieudichchuyen.unsigned.apk 2>&1 | tee export.log
          echo "=== Build output ==="
          ls -la build/android/ || true
          # Verify APK was created (don't silently succeed on failure)
          if [ ! -f build/android/phitieudichchuyen.unsigned.apk ]; then
            echo "❌ APK was not created. Check export.log above."
            exit 1
          fi
          echo "✅ Unsigned APK created: $(du -h build/android/phitieudichchuyen.unsigned.apk | cut -f1)"

      - name: Zipalign + Sign APK with apksigner
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"

          # Generate a debug keystore (self-signed, 10000-day validity).
          # For production, replace with a stored release keystore via GitHub Secret.
          KEYSTORE_PATH="$HOME/phitieu-debug.keystore"
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias phitieu \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PhiTieuDichChuyen, OU=Dev, O=PhiTieuDichChuyen, L=Hanoi, ST=Hanoi, C=VN"

          # Zipalign: -p 4 means page-align .so files to 4 KiB
          echo "Zipaligning APK..."
          zipalign -v -p 4 build/android/phitieudichchuyen.unsigned.apk build/android/phitieudichchuyen.aligned.apk > /dev/null

          # apksigner: sign with v1 (JAR) + v2 (Android 7+) + v3 (Android 9+) schemes
          echo "Signing APK (v1+v2+v3)..."
          apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias phitieu \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/android/phitieudichchuyen.apk \
            build/android/phitieudichchuyen.aligned.apk

          # Verify signature
          echo "Verifying APK signature..."
          apksigner verify --verbose --print-certs build/android/phitieudichchuyen.apk | head -20

          # Clean up intermediate files
          rm -f build/android/phitieudichchuyen.unsigned.apk build/android/phitieudichchuyen.aligned.apk

          echo "=== Final APK ==="
          ls -la build/android/phitieudichchuyen.apk
          echo "✅ Signed APK size: $(du -h build/android/phitieudichchuyen.apk | cut -f1)"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 2: Build Windows Desktop (Parallel)
  # ============================================
  build-windows:
    name: 🪟 Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed."

      - name: Import Project
        run: |
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed" && exit 1)

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/phitieudichchuyen.exe 2>&1 | tee export.log
          ls -la build/windows/ || true
          if [ ! -f build/windows/phitieudichchuyen.exe ]; then
            echo "❌ Windows .exe was not created."
            exit 1
          fi
          echo "✅ Windows build created: $(du -h build/windows/phitieudichchuyen.exe | cut -f1)"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/*.exe
            build/windows/*.pck
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 3: Build Linux (Parallel)
  # ============================================
  build-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed."

      - name: Import Project
        run: |
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed" && exit 1)

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/phitieudichchuyen.x86_64 2>&1 | tee export.log
          ls -la build/linux/ || true
          if [ ! -f build/linux/phitieudichchuyen.x86_64 ]; then
            echo "❌ Linux binary was not created."
            exit 1
          fi
          echo "✅ Linux build created: $(du -h build/linux/phitieudichchuyen.x86_64 | cut -f1)"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/linux/*.x86_64
            build/linux/*.pck
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 4: Build & Push Relay Server Docker Image
  # ============================================
  build-relay-server:
    name: 🌐 Build Relay Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME:-${GITHUB_SHA::7}}" >> $GITHUB_OUTPUT

      - name: Build and Push Relay Server
        uses: docker/build-push-action@v6
        with:
          context: ./relay-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/phitieu-relay:latest
            ghcr.io/${{ github.repository_owner }}/phitieu-relay:${{ steps.tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 5: Create GitHub Release (after all builds)
  # ============================================
  create-release:
    name: 📦 Create Release
    needs: [build-android, build-windows, build-linux, build-relay-server]
    # Trigger conditions:
    #   - tag push (github.ref starts with refs/tags/v)
    #   - OR release:published event (github.event_name == 'release')
    #   - OR workflow_dispatch
    # Build requirements:
    #   - Windows + Linux + Relay MUST succeed (Android is optional due to SDK complexity)
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-relay-server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: rel
        run: |
          # For push (tag) events: use the pushed tag name (e.g. "v1.9")
          # For release events: use the release's tag_name (e.g. "v1.9")
          # For workflow_dispatch: use the input, but ensure it starts with "v"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            INPUT_VER="${{ inputs.version }}"
            if [ -z "$INPUT_VER" ]; then
              # Read from project.godot as fallback
              PROJECT_VER=$(grep 'config/version' project.godot | sed 's/.*="\([^"]*\)".*/\1/')
              TAG="v${PROJECT_VER}"
            else
              # Ensure it starts with "v"
              case "$INPUT_VER" in
                v*) TAG="$INPUT_VER" ;;
                *) TAG="v${INPUT_VER}" ;;
              esac
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Will use release tag: ${TAG}"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-build'
          merge-multiple: false

      - name: Organize Release Files
        run: |
          mkdir -p release
          # Android (signed APK)
          cp artifacts/android-build/*.apk release/ 2>/dev/null || echo "No Android APK (build may have failed - acceptable)"
          # Windows
          cp artifacts/windows-build/*.exe release/ 2>/dev/null || true
          cp artifacts/windows-build/*.pck release/ 2>/dev/null || true
          # Linux
          cp artifacts/linux-build/*.x86_64 release/ 2>/dev/null || true
          cp artifacts/linux-build/*.pck release/phitieudichchuyen-linux.pck 2>/dev/null || true
          echo "=== Release files ==="
          ls -la release/ || echo "No release files found!"
          echo "Total size: $(du -sh release/ | cut -f1)"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release/*
          generate_release_notes: true
          body: |
            ## 🎯 Phi Tiêu Dịch Chuyển ${{ steps.rel.outputs.tag }}

            ### 🆕 Tính năng v2.1

            #### 🔥 FIX CRITICAL: Online Mode Hoạt Động!
            - **Lỗi gốc**: `matchmaking_screen.gd` KHÔNG BAO GIỜ gọi `NetworkManager.join_matchmaking()` → user stuck "Đang tìm trận..." mãi mãi dù server online.
            - **Fix**: Tự động join queue khi login success, retry 5 lần nếu fail.

            #### 👑 Nhân Vật Mới: Hieu Louis - Classic
            - **Spawn Glitch 3s Bất Tử**: Khi vào trận, nhân vật bị glitch + tỏa ra các dòng code hacker trong 3 giây. Trong 3 giây đó là bất tử.
            - **Vô Hạn Đạn**: Không giới hạn số phi tiêu trên trường.
            - **Không Cooldown Bắn**: Không bị giới hạn tần suất bắn liên tục.
            - **Máu Cực Nhiều**: HP bonus +500, thanh HP dài hơn.
            - **Crown Skill (♛)**: Nút kỹ năng hình tròn có vương miện. Ghim 5 đối thủ gần nhất, +50% điểm (8s), CD 50s.
            - **SMG Reward**: Khi giết đủ 50 mạng, nhận tiểu liên bắn rất nhanh, vô hạn đạn (20s).
            - **Vòng Tròn Đỏ Highlight**: Khi aim đúng vào đối thủ, hiện vòng tròn đỏ xung quanh để dễ bắn trúng.
            - **Cách mở khóa**: Settings → Nhập Mã Quà Tặng → `hieulouis99`

            #### 🎨 Redesign UI
            - Menu, Settings, Mode Select, Mobile Controls, HUD đều được làm đẹp hơn.
            - Settings có section mới "🎁 Nhập Mã Quà Tặng".
            - Mobile controls layout gọn, không chồng lấn.

            #### 🐛 Bug Fixes
            - Fix chồng lấn TeleportButton vs SkillMultishotButton (overlap 110x60px)
            - Fix priority check: Teleport check TRƯỚC skill buttons
            - Auto-retry join matchmaking (5 lần, cách 2s)
            - Cleanup `login_success` + `connection_error` signal handlers trong `_exit_tree`
            - Crown button auto-hide khi không phải Classic mode
            - Target highlight pulsing vòng tròn đỏ quanh đối thủ

            ### 📦 Downloads
            - **Android**: `.apk` file (đã ký với debug keystore, có thể cài trực tiếp)
            - **Windows**: `.exe` + `.pck` files
            - **Linux**: `.x86_64` + `.pck` files
            - **Relay Server**: `ghcr.io/mhieuhonda/phitieu-relay:latest`

            ### 🎮 Hướng dẫn
            1. **Chơi Online**: Menu → Chơi Ngay → 🌐 Chơi Online → Đợi matchmaking → Bắt đầu!
            2. **Mở khóa Hieu Louis**: Menu → ⚙ Cài Đặt → 🎁 Nhập Mã Quà Tặng → `hieulouis99` → Đổi Mã
            3. **Crown Skill**: Khi chơi Hieu Louis, nút ♛ xuất hiện. Ấn để ghim 5 đối thủ + +50% điểm.
            4. **SMG Reward**: Giết 50 mạng → tự động nhận tiểu liên vô hạn 20s.
