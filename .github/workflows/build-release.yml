name: Build & Release

on:
  release:
    types: [published]

env:
  GODOT_VERSION: "4.2.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ─── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── System deps (headless Godot needs these on Ubuntu) ───
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libxi-dev libasound2-dev zip unzip wget

      # ─── Java (needed for Android Gradle build) ───────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ─── Android SDK ──────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools & platform
        run: |
          sdkmanager --install "build-tools;33.0.2"
          sdkmanager --install "platforms;android-33"

      # ─── Godot Editor ─────────────────────────────────────────
      - name: Download Godot Editor
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "Downloading Godot from: $GODOT_URL"
          wget -q "$GODOT_URL" -O godot-editor.zip
          unzip -o godot-editor.zip
          EDITOR_BIN=$(find . -maxdepth 1 -name 'Godot_v*_linux.x86_64' -not -name '*.zip' | head -1)
          if [ -z "$EDITOR_BIN" ]; then
            echo "ERROR: Could not find Godot editor binary after unzip"
            ls -la
            exit 1
          fi
          mv "$EDITOR_BIN" godot_editor
          chmod +x godot_editor
          echo "Godot editor ready: $(./godot_editor --version 2>&1 || true)"

      # ─── Export Templates ─────────────────────────────────────
      - name: Download Godot Export Templates
        run: |
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "Downloading templates from: $TEMPLATES_URL"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q "$TEMPLATES_URL" -O templates.tpz
          unzip -o templates.tpz
          ls templates/
          cp templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "Templates installed:"
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # ─── Import Project (critical for headless export) ────────
      - name: Import Godot Project
        run: |
          echo "Importing project..."
          timeout 60 ./godot_editor --headless --import --path . 2>&1 || true
          echo "Import completed (or timed out — that's OK)"

      # ─── Install Android Build Template ───────────────────────
      # Godot 4.2+ REQUIRES this step for Gradle build.
      # It extracts android_source.zip from export templates into android/build/
      - name: Install Android Build Template
        run: |
          echo "Installing Android build template..."
          # Try the Godot CLI command first (may fail if project has script errors)
          ./godot_editor --headless --path . --install-android-build-template 2>&1 || true
          # Verify: Godot 4.2 extracts android_source.zip to android/ directory
          # The expected structure is android/build.gradle, android/res/, etc.
          if [ -f "android/build.gradle" ]; then
            echo "Android build template installed successfully!"
            ls -la android/
          else
            echo "CLI command didn't work, trying manual extraction..."
            ANDROID_SOURCE="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
            if [ -f "$ANDROID_SOURCE" ]; then
              echo "Found android_source.zip, extracting manually..."
              # Godot 4.2 extracts android_source.zip to the android/ directory
              rm -rf android
              mkdir -p android
              unzip -o "$ANDROID_SOURCE" -d android/
              echo "Manual extraction done:"
              ls -la android/
              echo "Checking for build.gradle..."
              ls android/build.gradle 2>/dev/null && echo "build.gradle found!" || echo "WARNING: build.gradle NOT found"
            else
              echo "ERROR: android_source.zip not found in export templates!"
              find ~/.local/share/godot/export_templates/ -name "*android*" -type f 2>/dev/null || true
              exit 1
            fi
          fi

      # ─── Debug Keystore ───────────────────────────────────────
      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias phitieudichchuyen \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=PhiTieuDichChuyen, OU=Dev, O=PhiTieuDichChuyen, L=Hanoi, ST=Hanoi, C=VN" \
            -validity 10000

      # ─── Update export_presets.cfg for CI keystore ────────────
      - name: Configure Keystore in Export Presets
        run: |
          echo "Patching keystore settings..."
          python3 -c "
          with open('export_presets.cfg', 'r') as f:
              content = f.read()

          replacements = {
              'package/keystore=\"\"': 'package/keystore=\"debug.keystore\"',
              'package/keystore_passwd=\"\"': 'package/keystore_passwd=\"android\"',
              'package/key_alias=\"\"': 'package/key_alias=\"phitieudichchuyen\"',
              'package/key_passwd=\"\"': 'package/key_passwd=\"android\"',
              'package/signed_custom=false': 'package/signed_custom=true',
              'package/use_custom_keystore=false': 'package/use_custom_keystore=true',
          }
          for old, new in replacements.items():
              content = content.replace(old, new)

          # Embed PCK for Windows & Linux (single-file distribution)
          content = content.replace('binary_format/embed_pck=false', 'binary_format/embed_pck=true')

          with open('export_presets.cfg', 'w') as f:
              f.write(content)
          print('Patched successfully')
          "
          echo "=== Patched export_presets.cfg (Android section) ==="
          sed -n '/\[preset.0\]/,/^\[preset.1\]/p' export_presets.cfg

      # ─── Export Android APK ───────────────────────────────────
      - name: Export Android APK
        run: |
          mkdir -p build/android
          echo "Exporting Android APK..."
          ./godot_editor --headless --path . --export-release "Android" build/android/phitieudichchuyen.apk 2>&1
          echo "Export command finished"

      - name: Verify Android APK
        run: |
          if [ -f "build/android/phitieudichchuyen.apk" ]; then
            SIZE=$(stat -c%s "build/android/phitieudichchuyen.apk")
            echo "APK built successfully! Size: $SIZE bytes"
            ls -la build/android/phitieudichchuyen.apk
          else
            echo "ERROR: APK not found!"
            echo "=== Listing build directory ==="
            find build/ -type f 2>/dev/null || true
            exit 1
          fi

      # ─── Export Windows ───────────────────────────────────────
      - name: Export Windows Desktop
        run: |
          mkdir -p build/windows
          echo "Exporting Windows Desktop..."
          ./godot_editor --headless --path . --export-release "Windows Desktop" build/windows/phitieudichchuyen.exe 2>&1
          echo "Windows export command finished"

      - name: Package Windows build
        run: |
          cd build/windows
          if [ -f "phitieudichchuyen.exe" ]; then
            echo "Windows .exe found, creating ZIP..."
            zip -j ../../phitieudichchuyen-windows.zip ./*
            cd ../..
            echo "Windows ZIP created:"
            ls -la phitieudichchuyen-windows.zip
          else
            echo "WARNING: Windows .exe not found, skipping ZIP"
            cd ../..
            echo "Windows build contents:"
            find build/windows/ -type f 2>/dev/null || true
          fi

      # ─── Export Linux ─────────────────────────────────────────
      - name: Export Linux/X11
        run: |
          mkdir -p build/linux
          echo "Exporting Linux/X11..."
          ./godot_editor --headless --path . --export-release "Linux/X11" build/linux/phitieudichchuyen.x86_64 2>&1
          echo "Linux export command finished"

      - name: Package Linux build
        run: |
          cd build/linux
          if [ -f "phitieudichchuyen.x86_64" ]; then
            echo "Linux binary found, creating ZIP..."
            zip -j ../../phitieudichchuyen-linux.zip ./*
            cd ../..
            echo "Linux ZIP created:"
            ls -la phitieudichchuyen-linux.zip
          else
            echo "WARNING: Linux binary not found, skipping ZIP"
            cd ../..
            echo "Linux build contents:"
            find build/linux/ -type f 2>/dev/null || true
          fi

      # ─── Collect all artifacts ────────────────────────────────
      - name: List all build artifacts
        run: |
          echo "=== All build artifacts ==="
          find build/ -type f 2>/dev/null || true
          echo ""
          echo "=== ZIP files ==="
          ls -la *.zip 2>/dev/null || echo "No ZIP files"
          echo ""
          echo "=== APK ==="
          ls -la build/android/*.apk 2>/dev/null || echo "No APK"

      # ─── Upload to Release ────────────────────────────────────
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/android/phitieudichchuyen.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows ZIP to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('phitieudichchuyen-windows.zip') != ''
        with:
          files: phitieudichchuyen-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux ZIP to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('phitieudichchuyen-linux.zip') != ''
        with:
          files: phitieudichchuyen-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
