name: Build & Release Phi Tiêu Dịch Chuyển

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 3.1.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: '4.7'
  PROJECT_NAME: 'phitieudichchuyen'

jobs:
  # ============================================
  # JOB 1: Build Android APK
  # ============================================
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed:"
          ls ~/.local/share/godot/export_templates/${GV}.stable/

      - name: Setup Java 17 (for apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (for build-tools apksigner + zipalign)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          cd $ANDROID_HOME
          yes | ./cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ./cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34" > /dev/null 2>&1
          echo "Build tools installed:"
          ls $ANDROID_HOME/build-tools/34.0.0/ | grep -E "apksigner|zipalign"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Configure Godot editor settings (Android SDK path)
        run: |
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          cat > "$SETTINGS_DIR/editor_settings-3.tscn" <<'GDEOF'
          [application]

          config/use_custom_user_dir=true
          config/custom_user_dir_name="godot_ci"

          [export]

          android/android_sdk_path=""
          android/debug_keystore=""
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_pass="android"
          android/release_keystore=""
          android/release_keystore_user=""
          android/release_keystore_pass=""
          android/use_custom_build=false
          android/timestamp_output_apk=false
          android/force_system_user=false
          android/shutdown_adb_on_exit=true
          GDEOF
          # Also write the ConfigFile format for Godot 4.x
          cat > "$SETTINGS_DIR/editor_settings.cfg" <<'GDEOF2'
          [EditorSettings]

          export/android/android_sdk_path=""
          export/android/debug_keystore=""
          export/android/debug_keystore_user="androiddebugkey"
          export/android/debug_keystore_pass="android"
          export/android/release_keystore=""
          export/android/release_keystore_user=""
          export/android/release_keystore_pass=""
          export/android/use_custom_build=false
          export/android/timestamp_output_apk=false
          export/android/force_system_user=false
          export/android/shutdown_adb_on_exit=true
          GDEOF2
          # Override the Android SDK path via environment
          echo "export/android/android_sdk_path=\"${ANDROID_HOME}\"" >> "$SETTINGS_DIR/editor_settings.cfg"
          echo "Godot editor settings written"

      - name: Import Project
        run: |
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed, see log above" && exit 1)

      - name: Export Android APK (unsigned, from Godot)
        run: |
          mkdir -p build/android
          echo "Godot version: $(godot --version)"
          godot --headless --export-release "Android" build/android/phitieudichchuyen.unsigned.apk 2>&1 | tee export.log
          echo "=== Build output ==="
          ls -la build/android/ || true
          if [ ! -f build/android/phitieudichchuyen.unsigned.apk ]; then
            echo "APK was not created. Check export.log above."
            exit 1
          fi
          echo "Unsigned APK created: $(du -h build/android/phitieudichchuyen.unsigned.apk | cut -f1)"

      - name: Zipalign + Sign APK with apksigner
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"

          KEYSTORE_PATH="$HOME/phitieu-debug.keystore"
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias phitieu \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PhiTieuDichChuyen, OU=Dev, O=PhiTieuDichChuyen, L=Hanoi, ST=Hanoi, C=VN"

          echo "Zipaligning APK..."
          zipalign -v -p 4 build/android/phitieudichchuyen.unsigned.apk build/android/phitieudichchuyen.aligned.apk > /dev/null

          echo "Signing APK (v1+v2+v3)..."
          apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias phitieu \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/android/phitieudichchuyen.apk \
            build/android/phitieudichchuyen.aligned.apk

          echo "Verifying APK signature..."
          apksigner verify --verbose --print-certs build/android/phitieudichchuyen.apk | head -20

          rm -f build/android/phitieudichchuyen.unsigned.apk build/android/phitieudichchuyen.aligned.apk

          echo "=== Final APK ==="
          ls -la build/android/phitieudichchuyen.apk
          echo "Signed APK size: $(du -h build/android/phitieudichchuyen.apk | cut -f1)"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 2: Build Windows Desktop
  # ============================================
  build-windows:
    name: 🪟 Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed."

      - name: Import Project
        run: |
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed" && exit 1)

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/phitieudichchuyen.exe 2>&1 | tee export.log
          ls -la build/windows/ || true
          if [ ! -f build/windows/phitieudichchuyen.exe ]; then
            echo "Windows .exe was not created."
            exit 1
          fi
          echo "Windows build created: $(du -h build/windows/phitieudichchuyen.exe | cut -f1)"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/*.exe
            build/windows/*.pck
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 3: Build Linux
  # ============================================
  build-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        run: |
          GV="${{ env.GODOT_VERSION }}"
          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          echo "Downloading Godot $GV editor..."
          wget -q "$EDITOR_URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GV}-stable_linux.x86_64
          sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

          TPL_URL="https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          echo "Downloading export templates..."
          wget -q "$TPL_URL" -O godot_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q godot_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GV}.stable/
          echo "Export templates installed."

      - name: Import Project
        run: |
          godot --headless --import 2>&1 | tee import.log || (echo "Import failed" && exit 1)

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/phitieudichchuyen.x86_64 2>&1 | tee export.log
          ls -la build/linux/ || true
          if [ ! -f build/linux/phitieudichchuyen.x86_64 ]; then
            echo "Linux binary was not created."
            exit 1
          fi
          echo "Linux build created: $(du -h build/linux/phitieudichchuyen.x86_64 | cut -f1)"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/linux/*.x86_64
            build/linux/*.pck
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # JOB 4: Create GitHub Release (after all builds)
  # ============================================
  # v3.1: Đã gỡ build-relay-server (game offline, không cần relay server)
  create-release:
    name: 📦 Create Release
    needs: [build-android, build-windows, build-linux]
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            INPUT_VER="${{ inputs.version }}"
            if [ -z "$INPUT_VER" ]; then
              PROJECT_VER=$(grep 'config/version' project.godot | sed 's/.*="\([^"]*\)".*/\1/')
              TAG="v${PROJECT_VER}"
            else
              case "$INPUT_VER" in
                v*) TAG="$INPUT_VER" ;;
                *) TAG="v${INPUT_VER}" ;;
              esac
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Will use release tag: ${TAG}"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-build'
          merge-multiple: false

      - name: Organize Release Files
        run: |
          mkdir -p release
          cp artifacts/android-build/*.apk release/ 2>/dev/null || echo "No Android APK (build may have failed - acceptable)"
          cp artifacts/windows-build/*.exe release/ 2>/dev/null || true
          cp artifacts/windows-build/*.pck release/ 2>/dev/null || true
          cp artifacts/linux-build/*.x86_64 release/ 2>/dev/null || true
          cp artifacts/linux-build/*.pck release/phitieudichchuyen-linux.pck 2>/dev/null || true
          echo "=== Release files ==="
          ls -la release/ || echo "No release files found!"
          echo "Total size: $(du -sh release/ | cut -f1)"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release/*
          generate_release_notes: true
          body: |
            ## Phi Tiêu Dịch Chuyển ${{ steps.rel.outputs.tag }}

            ### v3.1 — Premium Custom UI

            - Custom background image (AnhNen.png) for lobby and in-game map
            - Custom game logo (TenGame.png) in lobby
            - Custom Play button image (PlayButton.png) rotated horizontal
            - Custom Settings button image (SettingButton.png)
            - Win overlay image (Win.png) shown on victory, fades after leaderboard appears
            - YouDie overlay image (YouDie.png) shown when player is eliminated
            - Touch scale animation on all buttons (scale up on press, scale down on release)
            - Removed relay server build (offline-only game)
            - Fixed GitHub Actions workflow for reliable CI/CD

            ### Downloads
            - **Android**: `.apk` file (signed with debug keystore)
            - **Windows**: `.exe` + `.pck` files
            - **Linux**: `.x86_64` + `.pck` files
