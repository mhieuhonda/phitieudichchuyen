name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.2.2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # 2. System dependencies (headless Godot needs these)
      # ──────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libxi-dev libxext-dev \
            wayland-protocols libwayland-dev \
            xvfb

      # ──────────────────────────────────────────────
      # 3. Java 17 (required for Android Gradle build)
      # ──────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ──────────────────────────────────────────────
      # 4. Android SDK
      # ──────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools & platform
        run: |
          sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      # ──────────────────────────────────────────────
      # 5. Download Godot Editor
      # ──────────────────────────────────────────────
      - name: Download Godot Editor
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot_editor.zip
          unzip -q godot_editor.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot_editor
          chmod +x godot_editor
          echo "Godot editor ready"

      # ──────────────────────────────────────────────
      # 6. Download & Install Export Templates
      # ──────────────────────────────────────────────
      - name: Download Godot Export Templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q export_templates.tpz -d extracted_templates
          cp -r extracted_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "Templates installed:"
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # ──────────────────────────────────────────────
      # 7. Configure Godot Editor Settings (CRITICAL for Android export)
      #    Godot reads Android SDK path from editor_settings, NOT env vars
      # ──────────────────────────────────────────────
      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot/
          cat > ~/.config/godot/editor_settings-4.tres << 'SETTINGS'
          [resource]

          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = ""
          export/android/debug_keystore_pass = ""
          export/android/debug_keystore_user = ""
          export/android/force_system_user = false
          network/http_proxy/host = ""
          network/http_proxy/port = 0
          text_editor/theme/color_theme = "Default"
          SETTINGS
          echo "=== Editor settings created ==="
          cat ~/.config/godot/editor_settings-4.tres

      # ──────────────────────────────────────────────
      # 8. Import project (generates .godot/ cache)
      # ──────────────────────────────────────────────
      - name: Import Godot Project
        run: |
          echo "Running headless import..."
          timeout 60 ./godot_editor --headless --import . 2>&1 || true
          echo "Import step completed"
          ls -la .godot/ 2>/dev/null || echo "Warning: .godot/ not created"

      # ──────────────────────────────────────────────
      # 9. Install Android Build Template (MUST be after import)
      #    This extracts android_source.zip from export templates
      #    into project's android/build/ directory
      # ──────────────────────────────────────────────
      - name: Install Android Build Template
        run: |
          echo "Installing Android build template..."
          ./godot_editor --headless --path . --install-android-build-template 2>&1 || true
          echo "=== Verifying android/build/ ==="
          if [ -d android/build ]; then
            echo "android/build/ exists:"
            ls -la android/build/
          else
            echo "android/build/ NOT found after --install-android-build-template"
            echo "Attempting manual installation..."
            # Fallback: manually extract android_source.zip from export templates
            ANDROID_SOURCE_ZIP=""
            for f in ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip \
                     extracted_templates/templates/android_source.zip; do
              if [ -f "$f" ]; then
                ANDROID_SOURCE_ZIP="$f"
                break
              fi
            done
            if [ -n "$ANDROID_SOURCE_ZIP" ]; then
              echo "Found android_source.zip at: $ANDROID_SOURCE_ZIP"
              mkdir -p android/build
              unzip -q "$ANDROID_SOURCE_ZIP" -d android/build/
              echo "Manual extraction done"
              ls -la android/build/
            else
              echo "ERROR: android_source.zip not found anywhere!"
              find ~/.local/share/godot/export_templates/ -name "android*" 2>/dev/null
              exit 1
            fi
          fi
          # Verify key files
          if [ -f android/build/build.gradle ]; then
            echo "build.gradle found - Android build template OK"
          else
            echo "ERROR: build.gradle not found in android/build/"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 10. Generate Debug Keystore
      # ──────────────────────────────────────────────
      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias phitieudichchuyen \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=PhiTieuDichChuyen, OU=Dev, O=PhiTieuDichChuyen, L=Hanoi, ST=Hanoi, C=VN" \
            -validity 10000

      # ──────────────────────────────────────────────
      # 11. Patch export_presets.cfg with keystore
      # ──────────────────────────────────────────────
      - name: Configure Keystore in Export Presets
        run: |
          python3 -c "
          with open('export_presets.cfg', 'r') as f:
              content = f.read()

          replacements = {
              'package/keystore=\"\"': 'package/keystore=\"debug.keystore\"',
              'package/keystore_passwd=\"\"': 'package/keystore_passwd=\"android\"',
              'package/key_alias=\"\"': 'package/key_alias=\"phitieudichchuyen\"',
              'package/key_passwd=\"\"': 'package/key_passwd=\"android\"',
              'package/signed_custom=false': 'package/signed_custom=true',
              'package/use_custom_keystore=false': 'package/use_custom_keystore=true',
          }
          for old, new in replacements.items():
              content = content.replace(old, new)

          with open('export_presets.cfg', 'w') as f:
              f.write(content)
          print('Patched successfully')
          "
          echo "=== Patched export_presets.cfg (Android section) ==="
          sed -n '/\[preset.0\]/,/^\[preset.1\]/p' export_presets.cfg

      # ──────────────────────────────────────────────
      # 12. Export Android APK
      # ──────────────────────────────────────────────
      - name: Export Android APK
        run: |
          mkdir -p build/android
          echo "Exporting Android APK..."
          ./godot_editor --headless --path . --export-release "Android" build/android/phitieudichchuyen.apk 2>&1
          echo "Export command finished with exit code: $?"

      - name: Verify Android APK
        run: |
          if [ -f build/android/phitieudichchuyen.apk ]; then
            echo "APK built successfully!"
            ls -lh build/android/phitieudichchuyen.apk
          else
            echo "ERROR: APK not found at build/android/phitieudichchuyen.apk"
            echo "Listing build directory:"
            find build/ -type f 2>/dev/null || echo "No build directory"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 13. Export Windows Desktop
      # ──────────────────────────────────────────────
      - name: Export Windows Desktop
        run: |
          mkdir -p build/windows
          echo "Exporting Windows Desktop..."
          ./godot_editor --headless --path . --export-release "Windows Desktop" build/windows/phitieudichchuyen.exe 2>&1
          echo "Export command finished with exit code: $?"

      - name: Verify Windows build
        run: |
          if [ -f build/windows/phitieudichchuyen.exe ]; then
            echo "Windows EXE built successfully!"
            ls -lh build/windows/phitieudichchuyen.exe
          else
            echo "ERROR: Windows EXE not found"
            find build/windows/ -type f 2>/dev/null || echo "No windows build dir"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 14. Package Windows build
      # ──────────────────────────────────────────────
      - name: Package Windows build
        run: |
          cd build/windows
          zip -r ../../phitieudichchuyen-windows.zip .
          cd ../..
          echo "Windows ZIP created: $(ls -lh phitieudichchuyen-windows.zip)"

      # ──────────────────────────────────────────────
      # 15. Export Linux/X11
      # ──────────────────────────────────────────────
      - name: Export Linux/X11
        run: |
          mkdir -p build/linux
          echo "Exporting Linux/X11..."
          ./godot_editor --headless --path . --export-release "Linux/X11" build/linux/phitieudichchuyen.x86_64 2>&1
          echo "Export command finished with exit code: $?"

      - name: Verify Linux build
        run: |
          if [ -f build/linux/phitieudichchuyen.x86_64 ]; then
            echo "Linux binary built successfully!"
            ls -lh build/linux/phitieudichchuyen.x86_64
          else
            echo "ERROR: Linux binary not found"
            find build/linux/ -type f 2>/dev/null || echo "No linux build dir"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 16. Package Linux build
      # ──────────────────────────────────────────────
      - name: Package Linux build
        run: |
          cd build/linux
          zip -r ../../phitieudichchuyen-linux.zip .
          cd ../..
          echo "Linux ZIP created: $(ls -lh phitieudichchuyen-linux.zip)"

      # ──────────────────────────────────────────────
      # 17. List all build artifacts
      # ──────────────────────────────────────────────
      - name: List all build artifacts
        run: |
          echo "=== All build artifacts ==="
          find build/ -type f -exec ls -lh {} \;
          echo "=== ZIP packages ==="
          ls -lh *.zip 2>/dev/null || echo "No ZIP packages"
          ls -lh build/android/*.apk 2>/dev/null || echo "No APK"

      # ──────────────────────────────────────────────
      # 18. Upload to GitHub Release
      # ──────────────────────────────────────────────
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/android/phitieudichchuyen.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows ZIP to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: phitieudichchuyen-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux ZIP to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: phitieudichchuyen-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
