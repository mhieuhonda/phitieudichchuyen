# Phi Tiêu Dịch Chuyển - Relay Server Deployment (v2.4)
# Chạy trên VPS qua Coolify hoặc trực tiếp bằng docker-compose
# v1.8: Single-port (3000) cho cả HTTP + WebSocket — Traefik-friendly

version: '3.8'

services:
  phitieu-relay:
    image: ghcr.io/mhieuhonda/phitieu-relay:latest
    container_name: phitieu-relay
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - phitieu-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/game.db
      - MATCH_MIN_PLAYERS=10
      - MATCH_MAX_PLAYERS=20
      - MATCH_TIMEOUT_MS=30000
      - TICK_RATE_MS=50
      - MAX_ROOMS=50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  phitieu-data:
    driver: local
