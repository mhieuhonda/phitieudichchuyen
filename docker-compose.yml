# Phi Tiêu Dịch Chuyển - Relay Server Deployment (v2.6)
# Chạy trên sub-VPS qua Coolify (sau Traefik reverse proxy)
# v2.0: Fix HEALTHCHECK start-period, bind 0.0.0.0, X-Forwarded-* headers

version: '3.8'

services:
  phitieu-relay:
    image: ghcr.io/mhieuhonda/phitieu-relay:v2.6
    container_name: phitieu-relay
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - phitieu-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/game.db
      - MATCH_MIN_PLAYERS=10
      - MATCH_MAX_PLAYERS=20
      - MATCH_TIMEOUT_MS=30000
      - TICK_RATE_MS=50
      - MAX_ROOMS=50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  phitieu-data:
    driver: local
